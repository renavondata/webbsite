[project]
name = "webbsite"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "psycopg2-binary",
    "sqlalchemy",
    "gunicorn",
    "python-dotenv",
    "colorama>=0.4.6",
    "bcrypt>=4.0.0",
    "sentry-sdk[flask]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "requests>=2.33.0",
    "ruff>=0.14.1",
]
test = [
    "beautifulsoup4>=4.14.2",
    "colorama>=0.4.6",
    "lxml>=6.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.33.0",
]

[tool.ruff]
line-length = 120
# Only lint; the ported ASP code is not reformatted wholesale.
[tool.ruff.lint]
# The pre-0.15 ruff defaults, stated explicitly so a ruff upgrade cannot widen
# the gate on its own. Ratchet: add codes here as the codebase earns them.
select = ["E4", "E7", "E9", "F"]
# E722 (bare except) is endemic to the ported routes (~40 sites) and every one
# renders an empty page rather than a 500 -- Sentry now sees them via db.py's
# ERROR log. Fix them as routes are touched, not in one sweep.
ignore = ["E722"]
[tool.ruff.lint.per-file-ignores]
# Baseline as of 2026-09-16: unused locals in ported routes, and the blueprint
# aggregator's import-after-code. Shrink these lists; never grow them.
"webbsite/routes/dbpub/__init__.py" = ["E402"]
"webbsite/routes/ccass.py" = ["F841"]
"webbsite/routes/dbpub/corporate.py" = ["F841"]
"webbsite/routes/dbpub/incorporations.py" = ["F841"]
"webbsite/routes/dbpub/sdi.py" = ["F841"]
"webbsite/routes/dbpub/sfc.py" = ["F841"]
"webbsite/routes/dbpub/statistics.py" = ["F841"]
"webbsite/routes/dbpub/transport.py" = ["F841"]
"webbsite/routes/mailman.py" = ["F841"]
"webbsite/routes/pages.py" = ["F841"]
