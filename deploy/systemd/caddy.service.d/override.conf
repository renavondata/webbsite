# Drop-in over the distro's /usr/lib/systemd/system/caddy.service.
#
# WHY THIS FILE EXISTS. On 2026-09-11 02:26:47 UTC the kernel's *global* OOM
# killer chose caddy (4.7 GB anon RSS on an 8 GB box with no swap) during a
# scraper flood. The stock unit carries no Restart=, so `failed (oom-kill)` was
# terminal: the origin served nothing for five days while Cloudflare returned
# 521 and a handful of edge-cached pages made the site look alive. The app was
# healthy the entire time. Two independent bugs, two fixes here.
#
# Caddy's unit was not tracked in this repo before, which is *why* nobody
# noticed it had no restart policy. deploy/converge.sh now installs this.

[Unit]
# systemd's default (5 starts / 10s, then give up permanently) is the wrong
# policy for the process that IS the site. Under a flood that trips MemoryMax
# repeatedly we want it to keep coming back, however often, forever.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5s

# Make an overload kill LOCAL and recoverable instead of global and terminal.
# Caddy's footprint scales with in-flight requests, so a flood inflates it; with
# a cgroup ceiling the kernel kills only Caddy, Restart=always brings it back in
# 5s, and PostgreSQL/gunicorn never enter the OOM victim lottery.
# MemoryHigh throttles first as a warning band; MemoryMax is the hard stop.
# Steady-state for this proxy is tens of MB, so both are enormous headroom --
# they are a backstop for pathology, not a capacity limit.
MemoryAccounting=yes
MemoryHigh=1G
MemoryMax=1536M
