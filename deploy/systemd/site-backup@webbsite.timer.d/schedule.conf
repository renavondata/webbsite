# INTERIM: move webbsite's nightly backup from site-deploy's fleet-wide 02:30 UTC
# (10:30 in Hong Kong) to 19:00 UTC (03:00 HKT), HK's quietest hour.
#
# The producer is a ~35 min pg_dump that reads ~44 GB at whatever the disk
# gives; Nice=19 does not lower its I/O priority on this box's virtio disk. The
# two runs on 2026-09-29 slowed the live site (SLOW REQUEST lines at 1-2/min,
# up to 15.6 s; one crawler request hit the statement timeout). Daytime HK is
# exactly when that costs readers.
#
# Temporary by design: site-deploy owns this timer, and gfrmin/site-deploy#48
# asks for a per-app backup_time knob in site.toml. When it lands, delete this
# file AND its line in deploy/converge.sh's MAP, and set the knob instead --
# otherwise two sources set one timer.
[Timer]
OnCalendar=
OnCalendar=*-*-* 19:00:00 UTC
