# PostgreSQL tuning for webbsite-web, as code.
#
# Installed by deploy/converge.sh to /etc/postgresql/17/main/conf.d/webbsite.conf
# on every deploy tick. Until 2026-09 these lived only in postgresql.auto.conf,
# written by hand with ALTER SYSTEM during the May 2026 bootstrap and verified
# with a "check it actually took" checklist -- unmanaged, and undetected if it
# drifted. auto.conf OUTRANKS conf.d, so converge also resets any key declared
# here that auto.conf still carries; the daily invariants job then asserts the
# live value of every line matches this file.
#
# Sizing: 4 vCPU / 8 GB droplet, 72 GB database, 3 gunicorn workers x 8 threads
# x up to 8 pooled connections = 24, plus the loader, plus an operator.
# Changing shared_buffers or shared_preload_libraries needs a restart, which
# converge never does on its own: it reports `pending_restart` and leaves the
# restart to a person (a few seconds; do it after the 02:45 UTC refresh).

shared_buffers = '2GB'
effective_cache_size = '6GB'
maintenance_work_mem = '1GB'
work_mem = '96MB'
max_connections = 40
listen_addresses = 'localhost'
random_page_cost = 1.1
effective_io_concurrency = 200
max_wal_size = '4GB'

# Measurement (Phase 3e of the 2026-09 plan): which statements cost what, and
# whether the box is I/O bound, BEFORE deciding on a resize. Read them with
# scripts/pg_report.py. The 2s slow-statement log line goes to the Postgres
# log, not the app's; it is the query-level twin of the app's SLOW REQUEST line.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'top'
track_io_timing = on
log_min_duration_statement = 2000
