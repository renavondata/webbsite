# How webbsite deploys. Read by site-deploy's auto-deploy.sh on every tick.
#
# This file exists so the knobs that decide deploy behaviour are reviewable in a
# pull request. They used to live only in /etc/webbsite/env on the droplet,
# where nothing diffs them and nothing notices drift — which is how the
# committed unit in deploy/systemd/ ended up missing an ExecReload the box had
# been relying on for months.
#
# Secrets are NOT here and must not be: CF_CACHE_PURGE_TOKEN, DATABASE_URL and
# SECRET_KEY stay in /etc/webbsite/env, which is not in git.

[deploy]
# SIGHUP, not a restart. This is load-bearing in both directions:
#   * deploy/systemd/webbsite.service must keep ExecReload=/bin/kill -HUP $MAINPID
#     — `systemctl reload` on a unit without it fails outright.
#   * gunicorn.conf.py must keep preload_app = False — gunicorn does not reload
#     application code on HUP when preloaded, so recycled workers fork from the
#     stale master image while Jinja reads the NEW templates from disk. That skew
#     500'd every orgdata.asp request on 2026-07-16.
# Change any one of these three and you must change all three.
reload = "reload"

# Matches the live unit's ExecStart. --no-dev keeps test/lint deps off the box.
uv_args = "--frozen --no-dev"

# gunicorn binds 127.0.0.1:8000; Caddy fronts it on :443.
port = 8000

# Probed after the reload and BEFORE the Cloudflare purge. Purging first would
# refill the edge from a cold or broken origin; failing here leaves the edge
# serving the cached old site, which is the better failure.
health_path = "/health"

# A 200 from a half-booted worker is not health. /health returns {"status":"ok"}
# (webbsite/__init__.py:194), so require the body, not just the status code.
#
# Match the VALUE, not the whole object: the live response is compact
# ({"status":"ok"}, no space after the colon) and a Flask/jsonify change could
# alter the separators without changing the meaning. Checked against production
# rather than assumed — the spaced version would have failed every deploy.
health_match = '"ok"'

# HTML carries a 30-day CDN-Cache-Control, so a code deploy is invisible without
# the purge (deploy/README.md). The daily R2 -> Postgres refresh deliberately
# does NOT purge — its TTL ladder self-heals within 4h.
cf_zone_id = "c754c09daa8fb9cce8e4977d44cbd246"

# Apex of the zone deploy/cloudflare.json declares rules in. site-deploy's
# cf-converge@ (on a deploy that touches cloudflare.json) and cf-drift@ (daily)
# refuse to run without it; the token they use lives in /etc/webbsite/cf-env.
cf_domain = "renavon.com"

# Run deploy/converge.sh as root each tick, after `uv sync` and before the reload,
# so the tracked units and Caddyfile ARE the box rather than a hopeful mirror of it.
#
# This is the "plus a converge step" half of the fix begun in #27. That PR restored
# an ExecReload the repo had lost, but nothing stopped the next drift; this does.
# It was armed after 2026-09-11, when Caddy -- whose unit was tracked in no repo at
# all and therefore carried no Restart= that anyone had ever reviewed -- was
# OOM-killed during a scraper flood and left the site serving Cloudflare 521s for
# five days while gunicorn answered every health check on localhost.
#
# Root does not run the checkout's copy. Since gfrmin/site-deploy#39 the poller runs
# `sudo site-tree.sh converge webbsite <sha>`: root's own `git archive` of a commit
# verified to be on master, fetched from the origin pinned in
# /etc/site-deploy/origin/webbsite. The hook runs in a private mount namespace where
# /srv/webbsite IS that tree, read-only, so REPO=/srv/webbsite still works but
# everything converge.sh reads must be in git and it cannot write under /srv/webbsite.
# A deploy-ref override to any branch but master therefore deploys without
# converging. What merge access grants is unchanged: whatever reaches master runs as
# root on this box. The repo is public to READ; merge is not, and that is the boundary.
converge = true

# The uptime probe is external: hc.gfrm.in's `webbsite.renavon.com-probe`, run off
# the box and so closer to a visitor's view. This tells site-deploy not to arm a
# second on-box probe (site-probe@) for the same outage, and not to nag UNPROBED.
# site-checks-armed@webbsite (ops-env) holds the named check to not-paused and
# not-stale, so the check itself vanishing is still an alarm.
probe_external = "webbsite.renavon.com-probe"

# site-backup@webbsite runs deploy/backup-producer.sh (a pg_dump -Fc of the ~77 GB
# enigma database) through site-deploy's backup.sh: age-encrypt, rclone to R2, then
# read the whole object back to verify. The dump alone measured 22m19s / 5.24 GB on
# 2026-09-28 (nice 19, ionice idle, under crawl load), past the unit's 20min
# default, and the encrypt + upload + round trip roughly doubles it. 2h leaves room
# for the database to grow. host-converge renders this into a TimeoutStartSec
# drop-in (gfrmin/site-deploy#42). The healthcheck's grace must exceed it, because
# backup.sh pings /start at the beginning of the run.
backup_timeout = "2h"

# health_path stays on the SHALLOW /health on purpose, even though ?deep=1 exists.
# This gate answers "did the new code boot and start serving", which is the
# deploy's business. ?deep=1 also asserts the data is fresh -- a true and useful
# thing, but not one a code deploy should be blocked by: a stale upstream feed
# would otherwise wedge every deploy, including the one carrying the fix. Data
# freshness belongs to the uptime probe and the refresh loader's own dead-man.

# Deploy the ref .github/workflows/tests.yml fast-forwards on a green master
# run, not master itself, so an untested commit never serves. site-deploy
# refuses to deploy (and fails the dead-man) if the ref is missing rather than
# falling back to master, and warns when ci-green lags master. To ship past a
# broken CI, write `master` to /etc/webbsite/deploy-ref on the box (a file, not
# a converged setting, so converge does not undo it); delete it afterwards.
# A change to this knob takes effect from the NEXT deploy, not the one carrying it.
deploy_ref = "ci-green"

# No build_service: webbsite is Postgres-backed and has no snapshot builder.
# No Tailwind either — there is no static/src.css, so the CSS step auto-skips.
